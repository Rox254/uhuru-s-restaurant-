<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservations - Uhuru Restaurant</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    height: 70px;
    background: #151515;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
}

.logo {
    color: #f5b400;
    font-size: 24px;
    font-weight: bold;
}

.hamburger {
    width: 45px;
    height: 45px;
    background: #f5b400;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    padding: 8px;
}

.hamburger span {
    display: block;
    height: 3px;
    background: #111;
    margin: 5px 0;
}

.menu {
    display: none;
    position: absolute;
    right: 20px;
    top: 70px;
    background: #1d1d1d;
    width: 200px;
    z-index: 10;
    border-radius: 6px;
}

.menu.active {
    display: block;
}

.menu a {
    display: block;
    padding: 15px;
    color: white;
    text-decoration: none;
    border-bottom: 1px solid #333;
}

.menu a:hover {
    color: #f5b400;
}

.hero {
    height: 300px;
    background:
    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
    url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1400&q=80")
    center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero h1 {
    font-size: 42px;
    color: #f5b400;
}

.container {
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
}

.form-box {
    background: #1d1d1d;
    padding: 30px;
    border-radius: 10px;
}

.form-box h2 {
    color: #f5b400;
    margin-bottom: 20px;
    text-align: center;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 5px;
    background: #292929;
    color: white;
}

textarea {
    height: 100px;
    resize: vertical;
}

button.submit {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: #f5b400;
    color: #111;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

button.submit:hover {
    background: #ffc933;
}

footer {
    background: #151515;
    text-align: center;
    padding: 25px;
    margin-top: 40px;
    color: #aaa;
}

@media (max-width: 700px) {
    .hero h1 {
        font-size: 32px;
    }

    .container {
        margin: 20px auto;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Uhuru Restaurant</div>

    <button class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="menu" id="menu">
        <a href="home.html">Home</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
        <a href="reviews.html">Reviews</a>
        <a href="gallery.html">Gallery</a>
    </nav>
</header>

<section class="hero">
    <h1>Reserve a Table</h1>
</section>

<div class="container">

    <div class="form-box">
        <h2>Make a Reservation</h2>

        <form onsubmit="makeReservation(event)">

            <label>Your Name</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Phone Number</label>
            <input type="tel" placeholder="+254..." required>

            <label>Date</label>
            <input type="date" required>

            <label>Time</label>
            <input type="time" required>

            <label>Number of Guests</label>
            <select required>
                <option value="">Select guests</option>
                <option>1 Guest</option>
                <option>2 Guests</option>
                <option>3 Guests</option>
                <option>4 Guests</option>
                <option>5 Guests</option>
                <option>6+ Guests</option>
            </select>

            <label>Special Request</label>
            <textarea placeholder="Any special request?"></textarea>

            <button class="submit" type="submit">
                Reserve Table
            </button>

        </form>
    </div>

</div>

<footer>
    <p>© 2026 Uhuru Restaurant. All Rights Reserved.</p>
</footer>

<script>
function toggleMenu() {
    const menu = document.getElementById("menu");
    menu.classList.toggle("active");
}

function makeReservation(event) {
    event.preventDefault();
    alert("Thank you! Your reservation request has been received.");
}
</script>

</body>
</html>
