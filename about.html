<html lang="en">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            height: 70px;
            background: #151515;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: relative;
        }

        .logo {
            color: #f5b400;
            font-size: 24px;
            font-weight: bold;
        }

        /* HAMBURGER */
        .hamburger {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 6px;
            background: #f5b400;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .hamburger span {
            width: 26px;
            height: 3px;
            background: #111;
            border-radius: 5px;
        }

        /* MENU */
        .menu {
            display: none;
            position: absolute;
            top: 70px;
            right: 20px;
            width: 220px;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            z-index: 1000;
        }

        .menu.active {
            display: block;
        }

        .menu a {
            display: block;
            padding: 16px 20px;
            color: white;
            text-decoration: none;
            border-bottom: 1px solid #333;
        }

        .menu a:hover {
            background: #f5b400;
            color: #111;
        }

        /* PAGE HERO */
        .page-hero {
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;

            background:
                linear-gradient(
                    rgba(0,0,0,.55),
                    rgba(0,0,0,.8)
                ),
                url("https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=1400&q=80");

            background-size: cover;
            background-position: center;
        }

        .page-hero h1 {
            font-size: 52px;
            color: #f5b400;
        }

        .page-hero p {
            margin-top: 15px;
            font-size: 18px;
        }
