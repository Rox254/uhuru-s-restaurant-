<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Drinks - Uhuru Restaurant</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    height: 70px;
    background: #151515;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: relative;
}

.logo {
    color: #f5b400;
    font-size: 24px;
    font-weight: bold;
}

.hamburger {
    width: 45px;
    height: 45px;
    background: #f5b400;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
}

.hamburger span {
    width: 25px;
    height: 3px;
    background: #111;
}

.menu {
    display: none;
    position: absolute;
    top: 70px;
    right: 20px;
    background: #1d1d1d;
    width: 200px;
    z-index: 1000;
    border-radius: 8px;
    overflow: hidden;
}

.menu.active {
    display: block;
}

.menu a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 15px;
    border-bottom: 1px solid #333;
}

.menu a:hover {
    background: #f5b400;
    color: #111;
}

.hero {
    height: 280px;

    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),

    center/cover;

    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}
