<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Location - Uhuru Restaurant</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    height: 70px;
    background: #151515;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
}

.logo {
    color: #f5b400;
    font-size: 24px;
    font-weight: bold;
}

.hamburger {
    width: 45px;
    height: 45px;
    background: #f5b400;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    padding: 8px;
}

.hamburger span {
    display: block;
    height: 3px;
    background: #111;
    margin: 5px 0;
}

.menu {
    display: none;
    position: absolute;
    right: 20px;
    top: 70px;
    background: #1d1d1d;
    width: 200px;
    z-index: 10;
    border-radius: 6px;
}

.menu.active {
    display: block;
}

.menu a {
    display: block;
    padding: 15px;
    color: white;
    text-decoration: none;
    border-bottom: 1px solid #333;
}

.menu a:hover {
    color: #f5b400;
}

.hero {
    height: 300px;
    background:
    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
    url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1400&q=80")
    center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero h1 {
    font-size: 42px;
    color: #f5b400;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

.location-box {
    background: #1d1d1d;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
}

.location-box h2 {
    color: #f5b400;
    margin-bottom: 20px;
}

.location-box p {
    margin: 12px 0;
    line-height: 1.6;
}

.map {
    margin-top: 30px;
    height: 300px;
    background: #292929;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.map h3 {
    color: #f5b400;
}

.button {
    display: inline-block;
    margin-top: 25px;
    padding: 14px 25px;
    background: #f5b400;
    color: #111;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

footer {
    background: #151515;
    text-align: center;
    padding: 25px;
    margin-top: 40px;
    color: #aaa;
}

@media (max-width: 700px) {
    .hero h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Uhuru Restaurant</div>

    <button class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="menu" id="menu">
        <a href="home.html">Home</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
        <a href="reviews.html">Reviews</a>
        <a href="gallery.html">Gallery</a>
    </nav>
</header>

<section class="hero">
    <h1>Find Us</h1>
</section>

<div class="container">

    <div class="location-box">

        <h2>Our Location</h2>

        <p>📍 Uhuru Restaurant</p>
        <p>Nairobi, Kenya</p>

        <p>🕒 Open Daily: 8:00 AM – 10:00 PM</p>

        <a class="button"
           href="https://www.google.com/maps/search/?api=1&query=Uhuru+Restaurant+Nairobi"
           target="_blank">
            Open in Google Maps
        </a>

        <div class="map">
            <div>
                <h3>📍 Uhuru Restaurant</h3>
                <p>Nairobi, Kenya</p>
                <p>Tap the button above to open Google Maps.</p>
            </div>
        </div>

    </div>

</div>

<footer>
    <p>© 2026 Uhuru Restaurant. All Rights Reserved.</p>
</footer>

<script>
function toggleMenu() {
    const menu = document.getElementById("menu");
    menu.classList.toggle("active");
}
</script>

</body>
</html>
