<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery - Uhuru Restaurant</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

/* HEADER */

header {
    height: 70px;
    background: #151515;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: relative;
}

.logo {
    color: #f5b400;
    font-size: 24px;
    font-weight: bold;
}

/* HAMBURGER */

.hamburger {
    width: 45px;
    height: 45px;
    background: #f5b400;
    border: none;
    border-radius: 6px;
    cursor: pointer;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    gap: 5px;
}

.hamburger span {
    width: 25px;
    height: 3px;
    background: #111;
    display: block;
}

/* MENU */

.menu {
    display: none;
    position: absolute;
    top: 70px;
    right: 20px;

    background: #1d1d1d;
    width: 200px;

    z-index: 1000;
    border-radius: 8px;
    overflow: hidden;
}

.menu.active {
    display: block;
}

.menu a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 15px;

    border-bottom: 1px solid #333;
}

.menu a:hover {
    background: #f5b400;
    color: #111;
}

/* HERO */

.hero {
    height: 300px;

    background:
    linear-gradient(
        rgba(0,0,0,.55),
        rgba(0,0,0,.55)
    ),
    url("https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=1400&q=80")
    center/cover;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
}

.hero h1 {
    font-size: 48px;
    color: #f5b400;
}

/* GALLERY */

.gallery {
    padding: 50px 20px;
    max-width: 1200px;
    margin: auto;
}

.gallery h2 {
    text-align: center;
    color: #f5b400;
    margin-bottom: 30px;
    font-size: 32px;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.gallery-item {
    height: 250px;
    overflow: hidden;
    border-radius: 10px;
    background: #222;
}

.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;

    transition: transform .4s;
}

.gallery-item:hover img {
    transform: scale(1.08);
}

/* FOOTER */

footer {
    background: #151515;
    text-align: center;
    padding: 25px;
    margin-top: 30px;
    color: #aaa;
}

/* MOBILE */

@media (max-width: 700px) {

    .hero h1 {
        font-size: 36px;
    }

    .gallery-grid {
        grid-template-columns: 1fr;
    }

    .gallery-item {
        height: 230px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

    <div class="logo">
        Uhuru Restaurant
    </div>

    <button class="hamburger" onclick="toggleMenu()">

        <span></span>
        <span></span>
        <span></span>

    </button>

    <!-- MENU -->

    <nav class="menu" id="menu">

        <a href="home.html">Home</a>

        <a href="services.html">Services</a>

        <a href="contact.html">Contact</a>

        <a href="reviews.html">Reviews</a>

        <a href="gallery.html">Gallery</a>

    </nav>

</header>


<!-- HERO -->

<section class="hero">

    <h1>
        Our Gallery
    </h1>

</section>


<!-- GALLERY -->

<section class="gallery">

    <h2>
        Explore Uhuru Restaurant
    </h2>


    <div class="gallery-grid">


        <div class="gallery-item">

            <img
            src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=900&q=80"
            alt="Restaurant interior">

        </div>


        <div class="gallery-item">

            <img
            src="https://images.unsplash.com/photo-1552566626-52f8b828add9?auto=format&fit=crop&w=900&q=80"
            alt="Restaurant dining area">

        </div>


        <div class="gallery-item">

            <img
            src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80"
            alt="Delicious food">

        </div>


        <div class="gallery-item">

            <img
            src="https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=900&q=80"
            alt="Grilled meat">

        </div>


        <div class="gallery-item">

            <img
            src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=900&q=80"
            alt="Fresh pizza">

        </div>


        <div class="gallery-item">

            <img
            src="https://images.unsplash.com/photo-1559339352-11d035aa65de?auto=format&fit=crop&w=900&q=80"
            alt="Restaurant guests">

        </div>


    </div>

</section>


<!-- FOOTER -->

<footer>

    <p>
        © 2026 Uhuru Restaurant. All Rights Reserved.
    </p>

</footer>


<!-- HAMBURGER JAVASCRIPT -->

<script>

function toggleMenu() {

    const menu = document.getElementById("menu");

    menu.classList.toggle("active");

}

</script>

</body>
</html>
